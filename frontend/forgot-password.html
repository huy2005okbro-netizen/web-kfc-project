<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu - FBShop</title>
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-illustration auth-illustration--small">
      <div class="auth-illustration-overlay"></div>
    </div>

    <div class="auth-form-wrapper">
      <div class="auth-form">
        <div class="auth-icon-lock">🔒</div>
        <h1 class="auth-title">Quên mật khẩu ?</h1>
        <p class="auth-subtitle">
          Đừng lo lắng, chúng tôi sẽ hướng dẫn bạn đặt lại.
        </p>

        <form>
          <div class="form-group">
            <label for="forgot-email">Email</label>
            <input id="forgot-email" type="email" placeholder="Email" required />
          </div>

          <button type="submit" class="btn-primary btn-full-width">
            ✉ Gửi Email
          </button>
        </form>

        <div class="auth-switch auth-switch--center">
          <a class="link" href="./index.html">Quay lại đăng nhập</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
