<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng ký - FBShop</title>
  <link rel="stylesheet" href="./css/login.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-illustration auth-illustration--small">
      <div class="auth-illustration-overlay"></div>
    </div>

    <div class="auth-form-wrapper">
      <div class="auth-form">
        <h1 class="auth-title">Đăng ký</h1>

        <form>
          <div class="form-group">
            <label for="register-email">Email</label>
            <input id="register-email" type="email" placeholder="Email" required />
          </div>

          <div class="form-group">
            <label for="register-password">Mật khẩu</label>
            <div class="password-input">
              <input id="register-password" type="password" placeholder="Nhập mật khẩu" required />
              <button type="button" class="toggle-password" aria-label="Hiện / ẩn mật khẩu">
                👁
              </button>
            </div>
          </div>

          <div class="form-group">
            <label for="register-password-confirm">Nhập lại mật khẩu</label>
            <div class="password-input">
              <input id="register-password-confirm" type="password" placeholder="Nhập lại mật khẩu" required />
              <button type="button" class="toggle-password" aria-label="Hiện / ẩn mật khẩu">
                👁
              </button>
            </div>
          </div>

          <div class="form-group checkbox-group">
            <label class="checkbox">
              <input type="checkbox" required />
              <span class="checkbox-custom"></span>
              <span>Tôi đồng ý với <a class="link" href="#">Điều khoản sử dụng dịch vụ</a></span>
            </label>
          </div>

          <button type="submit" class="btn-primary btn-full-width">
            Đăng ký
          </button>
        </form>

        <div class="auth-switch auth-switch--center">
          <span>Bạn đã có tài khoản?</span>
          <a class="link" href="./index.html">Đăng nhập</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const toggleButtons = document.querySelectorAll('.toggle-password');
    toggleButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        if (!input) return;
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
      });
    });
  </script>
</body>
</html>
